name: Build Prism

# Builds Prism (the app you customise yourself) for the phone, TV and Windows PC from the public Ethereal code
# (whiteak/NuvioMobile and whiteak/NuvioTV, built on Nuvio) plus the files in this repo, and publishes them as a
# "prism-N" release here. Runs only when started by hand (Actions > Build Prism > Run workflow). "phone" builds
# just the phone app, for testing. Build numbers carry on from the old private repo (N = run number + 100), so
# installed apps see each new build as newer.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Publish a new release even if nothing changed
        type: boolean
        default: false
      apps:
        description: Which apps to build
        type: choice
        options: [all, phone, phone-tv]
        default: all

permissions:
  contents: write
  actions: write

concurrency:
  group: prism-${{ github.ref }}
  cancel-in-progress: false

env:
  MOBILE_REPO: whiteak/NuvioMobile
  # The Windows app lives on its own NuvioMobile branch (it already contains cmp-rewrite), so both apps build from it.
  MOBILE_BRANCH: claude/project-thread-lph2qt
  TV_REPO: whiteak/NuvioTV
  TV_BRANCH: dev

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      apps: ${{ steps.check.outputs.apps }}
      mobile_sha: ${{ steps.check.outputs.mobile_sha }}
      tv_sha: ${{ steps.check.outputs.tv_sha }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          APPS: ${{ inputs.apps }}
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the SIGNING_KEYSTORE and SIGNING_KEY_PASSWORD secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mobile_sha=$(git ls-remote "https://github.com/${MOBILE_REPO}.git" "refs/heads/${MOBILE_BRANCH}" | cut -f1)
          echo "mobile_sha=$mobile_sha" >> "$GITHUB_OUTPUT"
          tv_sha=$(git ls-remote "https://github.com/${TV_REPO}.git" "refs/heads/${TV_BRANCH}" | cut -f1)
          echo "tv_sha=$tv_sha" >> "$GITHUB_OUTPUT"
          stamp="Built from NuvioMobile ${mobile_sha}, NuvioTV ${tv_sha} and prism@${GITHUB_SHA}"
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '.[].tagName' | grep '^prism-' | head -1 || true)
          last_body=""
          [ -n "$last" ] && last_body=$(gh release view "$last" --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep '^Built from ' || true)
          release=true
          case "$EVENT" in
            push) case "$MESSAGE" in *"[release]"*) ;; *) release=false ;; esac ;;
            schedule) [ "$last_body" = "$stamp" ] && release=false ;;
            workflow_dispatch) [ "$last_body" = "$stamp" ] && [ "$FORCE" != "true" ] && release=false ;;
          esac
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Release: $release"
          # The apps go straight into a draft release (no build copies, which count against Actions storage);
          # Publish release makes it public once everything has built.
          if [ "$release" = "true" ]; then
            gh release create "prism-$((GITHUB_RUN_NUMBER + 100))" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Prism (building #$((GITHUB_RUN_NUMBER + 100)))" --notes "Still building."
          fi
          apps=all
          [ "$APPS" = "phone" ] && apps=phone
          [ "$APPS" = "phone-tv" ] && apps=phone-tv
          [ "$EVENT" = "push" ] && case "$MESSAGE" in *"[phone]"*) apps=phone ;; esac
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Apps: $apps"

  phone:
    name: Build phone app
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: edition
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MOBILE_REPO }}
          ref: ${{ needs.check.outputs.mobile_sha }}
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*
      # Private repos get smaller runners; free disk space, add swap and keep Gradle within the memory.
      - name: Fit the build in memory
        working-directory: src
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/lib/node_modules
          sudo fallocate -l 6G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          sed -i '/^org.gradle.jvmargs=/d; /^kotlin.daemon.jvmargs=/d; /^org.gradle.workers.max=/d' gradle.properties
          {
            echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx3g"
            echo "org.gradle.workers.max=2"
          } >> gradle.properties
      - id: build
        working-directory: src
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          KEY_ALIAS: ethereal
        run: |
          base=$(sed -n 's/^MARKETING_VERSION=//p' iosApp/Configuration/Version.xcconfig | tr -d '[:space:]')
          base_code=$(sed -n 's/^CURRENT_PROJECT_VERSION=//p' iosApp/Configuration/Version.xcconfig | tr -d '[:space:]')
          version="$base.$((GITHUB_RUN_NUMBER + 100))"
          code=$(( base_code * 1000 + GITHUB_RUN_NUMBER ))
          sed -i "s/^MARKETING_VERSION=.*/MARKETING_VERSION=$version/; s/^CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=$code/" iosApp/Configuration/Version.xcconfig
          bash ../edition/mobile/apply.sh .
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/signing.jks"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$KEY_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID"
            echo "TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET"
            echo "TRAKT_REDIRECT_URI=https://whiteak.github.io/Trakt-return/"
          } > local.properties
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace
          cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk "$RUNNER_TEMP/Prism-Android-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: needs.check.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4; do
            gh release upload "prism-$((GITHUB_RUN_NUMBER + 100))" "$RUNNER_TEMP"/Prism-Android-*.apk --repo "$GITHUB_REPOSITORY" --clobber && exit 0
            sleep $((i * 5))
          done
          exit 1

  tv:
    name: Build TV app
    needs: check
    if: needs.check.outputs.apps == 'all' || needs.check.outputs.apps == 'phone-tv'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: edition
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TV_REPO }}
          ref: ${{ needs.check.outputs.tv_sha }}
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*
      # Private repos get smaller runners; free disk space, add swap and keep Gradle within the memory.
      - name: Fit the build in memory
        working-directory: src
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/lib/node_modules
          sudo fallocate -l 6G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          sed -i '/^org.gradle.jvmargs=/d; /^kotlin.daemon.jvmargs=/d; /^kotlin.compiler.execution.strategy=/d; /^org.gradle.workers.max=/d' gradle.properties
          {
            echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.compiler.execution.strategy=in-process"
            echo "org.gradle.workers.max=2"
          } >> gradle.properties
      - id: build
        working-directory: src
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          KEY_ALIAS: ethereal
        run: |
          base=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          base_code=$(sed -n 's/^ *versionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts | head -1)
          version="$base.$((GITHUB_RUN_NUMBER + 100))"
          code=$(( base_code * 1000 + GITHUB_RUN_NUMBER ))
          sed -i "s/^\( *versionName = \)\".*\"/\1\"$version\"/; s/^\( *versionCode = \)[0-9][0-9]*$/\1$code/" app/build.gradle.kts
          grep -q "versionName = \"$version\"" app/build.gradle.kts
          bash ../edition/tv/apply.sh .
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          touch local.properties local.dev.properties
          printf 'TRAKT_CLIENT_ID=%s\nTRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_ID" "$TRAKT_CLIENT_SECRET" >> local.properties
          NUVIO_RELEASE_STORE_FILE="$RUNNER_TEMP/signing.jks" NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS \
          NUVIO_RELEASE_KEY_PASSWORD="$KEY_PASSWORD" NUVIO_RELEASE_STORE_PASSWORD="$KEY_PASSWORD" \
            ./gradlew :app:assembleFullDebug --stacktrace
          cp app/build/outputs/apk/full/debug/app-full-universal-debug.apk "$RUNNER_TEMP/Prism-TV-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: needs.check.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4; do
            gh release upload "prism-$((GITHUB_RUN_NUMBER + 100))" "$RUNNER_TEMP"/Prism-TV-*.apk --repo "$GITHUB_REPOSITORY" --clobber && exit 0
            sleep $((i * 5))
          done
          exit 1

  desktop:
    name: Build PC app
    needs: check
    if: needs.check.outputs.apps == 'all'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      # The edition's patches match on Unix line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: edition
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MOBILE_REPO }}
          ref: ${{ needs.check.outputs.mobile_sha }}
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*
      - name: Apply Prism
        working-directory: src
        shell: bash
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          bash ../edition/mobile/apply.sh .
          bash ../edition/desktop/apply.sh .
          printf 'TRAKT_CLIENT_ID=%s\nTRAKT_REDIRECT_URI=https://whiteak.github.io/Trakt-return/\n' "$TRAKT_CLIENT_ID" > local.properties
      - name: Download libVLC for the built-in player and sound converter
        shell: pwsh
        run: |
          $v = "3.0.21"
          Invoke-WebRequest "https://download.videolan.org/pub/videolan/vlc/$v/win64/vlc-$v-win64.zip" -OutFile vlc.zip
          Expand-Archive vlc.zip -DestinationPath vlc-extract
          $src = "vlc-extract/vlc-$v"
          $dst = "src/composeApp/desktop-resources/windows/vlc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$src/libvlc.dll", "$src/libvlccore.dll" $dst
          Copy-Item -Recurse "$src/plugins" $dst
          Remove-Item -Recurse -Force "$dst/plugins/gui", "$dst/plugins/lua", "$dst/plugins/visualization", "$dst/plugins/control" -ErrorAction SilentlyContinue
      - id: build
        name: Build the Windows installer
        working-directory: src
        shell: bash
        run: |
          version="1.0.$((GITHUB_RUN_NUMBER + 100))"
          ./gradlew --no-daemon :composeApp:packageMsi \
            -Pnuvio.desktop.appName=Prism \
            -Pnuvio.desktop.version=$version \
            -Pnuvio.desktop.upgradeUuid=7b1f4e2a-9c63-4d58-a0e7-5f3c2d8b6a19
          cp composeApp/build/compose/binaries/main/msi/*.msi "$RUNNER_TEMP/Prism-Windows-$version.msi"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: needs.check.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4; do
            gh release upload "prism-$((GITHUB_RUN_NUMBER + 100))" "$RUNNER_TEMP"/Prism-Windows-*.msi --repo "$GITHUB_REPOSITORY" --clobber && exit 0
            sleep $((i * 5))
          done
          exit 1

  release:
    name: Publish release
    needs: [check, phone, tv, desktop]
    # Phone-only runs skip the TV and PC, phone-and-TV runs skip the PC; otherwise all three must have built.
    if: >-
      always() && needs.check.outputs.release == 'true' && needs.phone.result == 'success' &&
      (needs.check.outputs.apps == 'phone' ||
       (needs.check.outputs.apps == 'phone-tv' && needs.tv.result == 'success') ||
       (needs.tv.result == 'success' && needs.desktop.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PHONE: ${{ needs.phone.outputs.version }}
          PC: ${{ needs.desktop.outputs.version }}
          TV: ${{ needs.tv.outputs.version }}
        run: |
          {
            printf 'Prism, the app you customise yourself, built on Ethereal.\n\n'
            printf -- '- Phone: Prism-Android-%s.apk\n' "$PHONE"
            if [ -n "$TV" ]; then
              printf -- '- TV: Prism-TV-%s.apk\n' "$TV"
              if [ -n "$PC" ]; then printf -- '- Windows PC: Prism-Windows-%s.msi (installs over the previous one)\n' "$PC"; else printf 'No PC app in this one (phone and TV only).\n'; fi
            else
              printf 'Phone only (a test build).\n'
            fi
            printf '\n'
            printf 'Customise it in Settings > Appearance > Customise on the phone; load the look on the TV in Settings > Appearance.\n\n'
            printf 'Built from NuvioMobile %s, NuvioTV %s and prism@%s\n' "${{ needs.check.outputs.mobile_sha }}" "${{ needs.check.outputs.tv_sha }}" "$GITHUB_SHA"
          } > notes.md
          gh release edit "prism-$((GITHUB_RUN_NUMBER + 100))" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest=false \
            --title "Prism $(date -u +%Y-%m-%d) (#$((GITHUB_RUN_NUMBER + 100)))" \
            --notes-file notes.md
          # Drafts left by runs that failed part-way.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' \
            | grep '^prism-' | while read -r d; do gh release delete "$d" --repo "$GITHUB_REPOSITORY" --yes || true; done
          # Keep only the newest 3 Prism releases (tags stay, so numbering never goes backwards), plus the newest one
          # with the PC app in it, so test builds never take that away.
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' | grep '^prism-' || true)
          full=""
          for t in $tags; do
            if gh release view "$t" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q '^Prism-Windows-'; then full=$t; break; fi
          done
          echo "$tags" | tail -n +4 | while read -r old; do
            [ -z "$old" ] || [ "$old" = "$full" ] || gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes || true
          done
      # The files are in the release now; drop every build copy in the repo so Actions storage stays near empty.
      - name: Clean up build copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true; done
