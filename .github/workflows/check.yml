name: Check Prism compiles

# Compiles one Prism app without building or publishing anything, to catch mistakes before a real build.
# Started by hand (Actions > Check Prism compiles > Run workflow).

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to compile
        type: choice
        options: [tv, phone, pc]
        default: tv

env:
  MOBILE_REPO: whiteak/NuvioMobile
  MOBILE_BRANCH: claude/project-thread-lph2qt
  TV_REPO: whiteak/NuvioTV
  TV_BRANCH: dev

jobs:
  android:
    name: Compile ${{ inputs.app }}
    if: inputs.app != 'pc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: edition
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app == 'tv' && env.TV_REPO || env.MOBILE_REPO }}
          ref: ${{ inputs.app == 'tv' && env.TV_BRANCH || env.MOBILE_BRANCH }}
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*
      - name: Compile
        working-directory: src
        run: |
          sed -i '/^org.gradle.jvmargs=/d; /^kotlin.daemon.jvmargs=/d; /^org.gradle.workers.max=/d' gradle.properties
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          touch local.properties local.dev.properties
          if [ "${{ inputs.app }}" = tv ]; then
            bash ../edition/tv/apply.sh .
            ./gradlew :app:compileFullDebugKotlin
          else
            bash ../edition/mobile/apply.sh .
            printf 'TRAKT_REDIRECT_URI=https://whiteak.github.io/Trakt-return/\n' > local.properties
            # The same task as a real build (an unsigned debug APK, thrown away): the phone has no lighter one.
            ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore
          fi

  pc:
    name: Compile pc
    if: inputs.app == 'pc'
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: edition
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MOBILE_REPO }}
          ref: ${{ env.MOBILE_BRANCH }}
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*
      - name: Compile
        working-directory: src
        shell: bash
        run: |
          bash ../edition/mobile/apply.sh .
          bash ../edition/desktop/apply.sh .
          printf 'TRAKT_REDIRECT_URI=https://whiteak.github.io/Trakt-return/\n' > local.properties
          ./gradlew --no-daemon :composeApp:compileKotlinDesktop
